name: power_nap_ai
description: "Power Nap AI - a minimal dark-mode 20-minute power nap app that starts the countdown only after you fall asleep."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 加速度计：用于检测手机是否静止（体动检测）
  sensors_plus: ^6.1.1
  # 音频播放：白噪音（助眠）与结束提示音
  audioplayers: ^6.1.0
  # 防止午休过程中屏幕自动熄屏/锁屏
  wakelock_plus: ^1.2.8
  # 麦克风 PCM 流：用于呼吸声与环境声分析（仅内存实时分析，不落盘）
  record: ^6.1.1
  # 持久化用户设置（严格度、白噪音、麦克风开关）
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # 注意：白噪音与提示音均由代码在内存中合成（WAV 字节流），
  # 因此不需要任何 assets 音频文件。
